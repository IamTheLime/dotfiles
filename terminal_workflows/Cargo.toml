[workspace]
resolver = "3"
members = ["crates/tw-terminal", "crates/tw-scripting", "crates/tw-control", "crates/tw-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
tw-terminal = { path = "crates/tw-terminal" }
tw-scripting = { path = "crates/tw-scripting" }
tw-control = { path = "crates/tw-control" }

gpui = "0.2.2"
libghostty-vt = "0.2.1"
portable-pty = "0.9"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.13"
oxc = { version = "0.150", features = ["transformer", "codegen", "semantic"] }
notify = "8"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false }

[profile.dev]
# Dependencies (gpui, png, syntect) are always optimised; so are the two crates on the
# frame path, because a debug-mode loop over a megapixel image costs tens of milliseconds.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.tw-terminal]
opt-level = 2

[profile.dev.package.tw-app]
opt-level = 2
